name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Build badge files
        run: python scripts/build_stats.py

      - name: Commit generated badge files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add api/*.json
          git diff --cached --quiet || git commit -m "Update generated badges"
          git push
