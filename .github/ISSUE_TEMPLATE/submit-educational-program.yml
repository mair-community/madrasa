name: Submit an AI education program
about: Suggest a Moroccan AI/data/PhD program to add to MADRASA
title: "Add program: <host> - <program name>"
labels: ["program-submission"]
body:
  - type: input
    id: program_name
    attributes:
      label: Program name
      placeholder: Data and Artificial Intelligence
    validations:
      required: true
  - type: input
    id: host_institution
    attributes:
      label: Host institution
      placeholder: INPT, ENSIAS, UCA, UM6P, etc.
    validations:
      required: true
  - type: input
    id: unit
    attributes:
      label: Unit
      placeholder: Faculty, school, CEDoc, center, or department
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - Bachelor
        - Engineer
        - Master
        - PhD
        - Postdoctoral
        - Certificate
        - Executive
        - Other
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: City
      placeholder: Rabat
  - type: input
    id: url
    attributes:
      label: Official/source URL
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Admission details, tuition, domains, duration, language, etc.
